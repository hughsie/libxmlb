name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - fedora
          - fedora-w64
          - debian
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t libxmlb-${{ matrix.distro }} -f contrib/ci/Dockerfile-${{ matrix.distro }} .
      - run: |
          docker run -t \
            -v `pwd`:/build \
            -e DESTDIR=/build/install \
            libxmlb-${{ matrix.distro }} \
            ./contrib/ci/build-${{ matrix.distro }}.sh
      - name: Upload gtkdoc for pages
        if: matrix.distro == 'fedora'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: libxmlb-doc
          path: install/usr/local/share/gtk-doc/html/libxmlb

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: libxmlb-doc
          path: libxmlb-doc
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: libxmlb-doc
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
